name: SevenSeas

options:
  bundleIdPrefix: com.johnjailbreak
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The workflow overrides both of these: version is 1.0.<run number>, build is the run number.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SevenSeas:
    type: application
    platform: iOS
    sources:
      - path: SevenSeas
    info:
      path: Config/Info.plist
      properties:
        # Settings > Update Notifications: the background check (UpdateNotifications.taskID).
        BGTaskSchedulerPermittedIdentifiers:
          - sevenseas.update-check
        UIBackgroundModes:
          - fetch
        CFBundleDisplayName: SevenSeas
        # Without these two, XcodeGen writes literal defaults and the app would report 1.0 (1)
        # whatever CI built. About reads them through AppInfo.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnjailbreak.sevenseas
        PRODUCT_NAME: SevenSeas
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO

# CI builds with -scheme SevenSeas, so the scheme is declared rather than left to Xcode.
schemes:
  SevenSeas:
    build:
      targets:
        SevenSeas: all
